services:
  pocketbase:
    build:
      context: ./services/pocketbase
      dockerfile: Dockerfile
    container_name: infchat-pocketbase-dev
    restart: unless-stopped
    command: /app/infchat-pocketbase serve --http=0.0.0.0:8090 --dev
    environment:
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-app.infchat}
      APNS_ENV: ${APNS_ENV:-sandbox}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_PRIVATE_KEY_BASE64: ${APNS_PRIVATE_KEY_BASE64:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecretdevsecretdevsecretdevsecret
      LIVEKIT_URL: ws://127.0.0.1:7880
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/app/pb_data

  redis:
    image: redis:7-alpine
    container_name: infchat-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: infchat-livekit-dev
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    depends_on:
      - redis
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./services/livekit/livekit.dev.yaml:/etc/livekit.yaml:ro

volumes:
  pocketbase_data:
  redis_data:
