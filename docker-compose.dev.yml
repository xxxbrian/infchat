services:
  pocketbase:
    build:
      context: ./services/pocketbase
      dockerfile: Dockerfile
    container_name: infchat-pocketbase-dev
    restart: unless-stopped
    command: /app/infchat-pocketbase serve --http=0.0.0.0:8090 --dev
    environment:
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-app.infchat}
      APNS_ENV: ${APNS_ENV:-sandbox}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_PRIVATE_KEY_BASE64: ${APNS_PRIVATE_KEY_BASE64:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      INFCHAT_MEDIA_S3_ACCESS_KEY_ID: ${INFCHAT_MEDIA_S3_ACCESS_KEY_ID:-infchat-dev}
      INFCHAT_MEDIA_S3_BUCKET: ${INFCHAT_MEDIA_S3_BUCKET:-infchat-media-dev}
      INFCHAT_MEDIA_S3_ENDPOINT: ${INFCHAT_MEDIA_S3_ENDPOINT:-http://minio:9000}
      INFCHAT_MEDIA_S3_FORCE_PATH_STYLE: ${INFCHAT_MEDIA_S3_FORCE_PATH_STYLE:-true}
      INFCHAT_MEDIA_S3_PRESIGN_ENDPOINT: ${INFCHAT_MEDIA_S3_PRESIGN_ENDPOINT:-http://localhost:9000}
      INFCHAT_MEDIA_S3_REGION: ${INFCHAT_MEDIA_S3_REGION:-us-east-1}
      INFCHAT_MEDIA_S3_SECRET_ACCESS_KEY: ${INFCHAT_MEDIA_S3_SECRET_ACCESS_KEY:-infchat-dev-secret}
      INFCHAT_MEDIA_STORAGE_PROFILE_ID: ${INFCHAT_MEDIA_STORAGE_PROFILE_ID:-local-minio}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecretdevsecretdevsecretdevsecret
      LIVEKIT_URL: ws://127.0.0.1:7880
    depends_on:
      minio-create-bucket:
        condition: service_completed_successfully
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/app/pb_data

  minio:
    image: minio/minio:latest
    container_name: infchat-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${INFCHAT_MEDIA_S3_ACCESS_KEY_ID:-infchat-dev}
      MINIO_ROOT_PASSWORD: ${INFCHAT_MEDIA_S3_SECRET_ACCESS_KEY:-infchat-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: minio/mc:latest
    container_name: infchat-minio-create-bucket-dev
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done &&
      mc mb --ignore-existing local/"$${INFCHAT_MEDIA_S3_BUCKET}"
      "
    environment:
      INFCHAT_MEDIA_S3_BUCKET: ${INFCHAT_MEDIA_S3_BUCKET:-infchat-media-dev}
      MINIO_ROOT_USER: ${INFCHAT_MEDIA_S3_ACCESS_KEY_ID:-infchat-dev}
      MINIO_ROOT_PASSWORD: ${INFCHAT_MEDIA_S3_SECRET_ACCESS_KEY:-infchat-dev-secret}

  redis:
    image: redis:7-alpine
    container_name: infchat-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: infchat-livekit-dev
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    depends_on:
      - redis
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./services/livekit/livekit.dev.yaml:/etc/livekit.yaml:ro

volumes:
  minio_data:
  pocketbase_data:
  redis_data:
