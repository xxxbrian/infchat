default_install_hook_types:
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        entry: commitlint --edit
        language: node
        additional_dependencies:
          - "@commitlint/cli@20.1.0"
          - "@commitlint/config-conventional@20.0.0"
        stages:
          - commit-msg
        pass_filenames: true
        always_run: true
